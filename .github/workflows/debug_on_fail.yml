name: CI/CD AI Debugger

on: 
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb langchain langchain-core langchain-groq langchain-huggingface langchain-chroma sentence-transformers python-dotenv

      - name: Simulate Failing Build
        id: test-suite
        run: |
          echo "Running unit tests..."
          echo "ERROR: TypeError: unsupported operand type(s) for +: 'int' and 'str' in calculate_total"
          exit 1 # This explicitly tells GitHub Actions that the pipeline failed

      - name: Run AI Debugger on Failure
        if: failure() # This ensures the script ONLY runs if a previous step failed
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Pipeline failed! Triggering AI Code Assistant..."
          python src/github_debug.py "TypeError: unsupported operand type(s) for +: 'int' and 'str' in calculate_total"